<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Antennae: two sweeping curves from head area -->
  <path d="M56 32C48 20 34 14 18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58 29C52 16 40 8 26 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

  <!-- Circular body split into 6 pie-segment slices (krill segmentation) -->
  <!-- The gaps between wedges create the "segmented" look -->
  <path d="M44 54 L44 30 A24 24 0 0 1 63 39 Z" fill="currentColor"/>
  <path d="M44 54 L65 40 A24 24 0 0 1 68 56 Z" fill="currentColor"/>
  <path d="M44 54 L68 57 A24 24 0 0 1 62 76 Z" fill="currentColor"/>
  <path d="M44 54 L60 77 A24 24 0 0 1 42 78 Z" fill="currentColor"/>
  <path d="M44 54 L41 78 A24 24 0 0 1 27 66 Z" fill="currentColor"/>
  <path d="M44 54 L26 64 A24 24 0 0 1 22 44 Z" fill="currentColor"/>

  <!-- Head: oval extending to upper-right from the body circle -->
  <ellipse cx="63" cy="32" rx="13" ry="8.5" fill="currentColor" transform="rotate(-18 63 32)"/>

  <!-- Connector: fills the gap between head and body -->
  <circle cx="54" cy="37" r="6" fill="currentColor"/>

  <!-- Eye: white outer with dark pupil + highlight -->
  <circle cx="67" cy="31" r="4.5" fill="white"/>
  <circle cx="68.5" cy="30" r="2" fill="currentColor"/>
  <circle cx="67" cy="29" r="0.8" fill="white"/>
</svg>
